kind = "web"
previewPath = "/"
title = "Aaron Shenny / EWS"
description = "Aaron Shenny’s personal backend and AI portfolio at /, with Extapano Web Studio services, policies and database-backed project inquiries at /work."
version = "1.0.0"
id = "artifacts/ews-studio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25607

[services.development]
run = "pnpm --filter @workspace/ews-studio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ews-studio", "run", "build" ]
serve = "static"
publicDir = "artifacts/ews-studio/dist/public"

[[services.production.rewrites]]
from = "/work"
to = "/work/index.html"

[[services.production.rewrites]]
from = "/work/"
to = "/work/index.html"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25607"
BASE_PATH = "/"
